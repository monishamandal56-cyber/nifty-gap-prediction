name: Daily Nifty Gap Prediction

on:
  schedule:
    - cron: '0 3 * * 1-5'   # 8:30 AM IST Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn yfinance pyarrow scipy

      - name: Run daily prediction
        run: python daily_predict.py

      - name: Commit prediction back to repo
        run: |
          git config user.name  "Nifty Bot"
          git config user.email "bot@nifty.local"
          git add logs/predictions/ || true
          git diff --staged --quiet || git commit -m "Prediction $(date -u +%Y-%m-%d)"
          git push || true
